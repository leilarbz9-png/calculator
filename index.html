    <!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculator</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #ead8bb;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 8px;
}

.calculator {
    width: 100%;
    max-width: 500px;
    min-height: calc(100vh - 16px);
    background: #e5cba4;
    border: 3px solid #b89463;
    border-radius: 30px;
    padding: 18px;
    box-shadow:
        0 12px 30px rgba(75, 48, 25, 0.25),
        inset 0 1px 2px rgba(255,255,255,0.7);
    position: relative;
    overflow: hidden;
}

.top {
    height: 55px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.history-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid #b89463;
    background: #f2dfbd;
    color: #54351e;
    font-size: 25px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(75,48,25,0.18);
}

.history-btn:active {
    transform: scale(0.94);
}

.display {
    height: 150px;
    background: #f8ecd8;
    border: 2px solid #c39e6b;
    border-radius: 25px;
    padding: 20px;
    margin-bottom: 20px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    overflow: hidden;
}

.expression {
    width: 100%;
    min-height: 30px;
    color: #866643;
    font-size: 21px;
    text-align: right;
    overflow-x: auto;
    white-space: nowrap;
}

.result {
    width: 100%;
    color: #4b2d17;
    font-size: 52px;
    font-weight: bold;
    text-align: right;
    overflow-x: auto;
    white-space: nowrap;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

.btn {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 50%;
    border: 1px solid #c19b68;
    background: #efd5aa;
    color: #4c2d18;
    font-size: 25px;
    cursor: pointer;
    box-shadow:
        0 5px 9px rgba(76,49,25,0.22),
        inset 0 1px 2px rgba(255,255,255,0.8);
    transition: 0.1s;
}

.btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 4px rgba(76,49,25,0.2);
}

.operator {
    background: #aa794d;
    color: white;
    border-color: #8c6038;
}

.clear {
    background: #d7b88b;
    color: #4d2f1a;
}

.backspace {
    background: #aa794d;
    color: white;
    font-size: 27px;
}

.equal {
    grid-column: span 3;
    aspect-ratio: auto;
    height: 75px;
    border-radius: 38px;
    background: #754c2e;
    color: white;
    border-color: #613c23;
    font-size: 38px;
}

.zero {
    grid-column: span 2;
    aspect-ratio: auto;
    border-radius: 40px;
}

.history-panel {
    position: absolute;
    inset: 0;
    background: #f2dfbd;
    z-index: 20;
    padding: 25px;
    transform: translateX(100%);
    transition: transform 0.3s ease;
    overflow-y: auto;
}

.history-panel.open {
    transform: translateX(0);
}

.history-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.history-header h2 {
    color: #56361f;
}

.close-history {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: #805738;
    color: white;
    font-size: 24px;
    cursor: pointer;
}

.history-item {
    background: #ead0a6;
    border-radius: 18px;
    padding: 15px;
    margin-bottom: 12px;
    color: #55351e;
    box-shadow: 0 3px 7px rgba(75,48,25,0.15);
}

.history-expression {
    font-size: 17px;
}

.history-result {
    font-size: 24px;
    font-weight: bold;
    margin-top: 5px;
}

.empty-history {
    text-align: center;
    color: #80613d;
    margin-top: 50px;
}

.clear-history {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 18px;
    background: #805738;
    color: white;
    font-size: 17px;
    margin-top: 15px;
    cursor: pointer;
}

@media (max-width: 380px) {

    .calculator {
        padding: 12px;
        border-radius: 25px;
    }

    .display {
        height: 125px;
    }

    .result {
        font-size: 40px;
    }

    .expression {
        font-size: 18px;
    }

    .buttons {
        gap: 8px;
    }

    .btn {
        font-size: 21px;
    }

    .equal {
        height: 65px;
        font-size: 32px;
    }
}

</style>
</head>

<body>

<div class="calculator">

    <div class="top">
        <button class="history-btn" onclick="openHistory()">↶</button>
    </div>

    <div class="display">
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
    </div>

    <div class="buttons">

        <button class="btn clear" onclick="clearAll()">C</button>

        <button class="btn" onclick="addValue('(')">(</button>

        <button class="btn" onclick="addValue(')')">)</button>

        <button class="btn operator" onclick="addValue('%')">%</button>


        <button class="btn" onclick="addValue('7')">7</button>

        <button class="btn" onclick="addValue('8')">8</button>

        <button class="btn" onclick="addValue('9')">9</button>

        <button class="btn operator" onclick="addValue('÷')">÷</button>


        <button class="btn" onclick="addValue('4')">4</button>

        <button class="btn" onclick="addValue('5')">5</button>

        <button class="btn" onclick="addValue('6')">6</button>

        <button class="btn operator" onclick="addValue('×')">×</button>


        <button class="btn" onclick="addValue('1')">1</button>

        <button class="btn" onclick="addValue('2')">2</button>

        <button class="btn" onclick="addValue('3')">3</button>

        <button class="btn operator" onclick="addValue('-')">−</button>


        <button class="btn zero" onclick="addValue('0')">0</button>

        <button class="btn" onclick="addValue(',')">,</button>

        <button class="btn operator" onclick="addValue('+')">+</button>


        <button class="btn backspace" onclick="backspace()">⌫</button>

        <button class="btn equal" onclick="calculate()">=</button>

    </div>


    <div class="history-panel" id="historyPanel">

        <div class="history-header">

            <h2>سجل العمليات</h2>

            <button class="close-history" onclick="closeHistory()">×</button>

        </div>

        <div id="historyList"></div>

        <button class="clear-history" onclick="clearHistory()">
            مسح السجل
        </button>

    </div>

</div>


<script>

let currentExpression = "";

let history =
    JSON.parse(localStorage.getItem("calculatorHistory")) || [];

const expressionElement =
    document.getElementById("expression");

const resultElement =
    document.getElementById("result");


function addValue(value) {

    if (
        resultElement.innerText !== "0" &&
        resultElement.innerText !== "" &&
        currentExpression === ""
    ) {
        currentExpression = resultElement.innerText;
    }

    if (value === ",") {
        value = ".";
    }

    currentExpression += value;

    expressionElement.innerText =
        currentExpression.replace(/\./g, ",");

    resultElement.innerText = "";
}


function backspace() {

    currentExpression =
        currentExpression.slice(0, -1);

    expressionElement.innerText =
        currentExpression.replace(/\./g, ",");

    if (currentExpression === "") {
        resultElement.innerText = "0";
    }
}


function clearAll() {

    currentExpression = "";

    expressionElement.innerText = "";

    resultElement.innerText = "0";
}


function calculate() {

    if (currentExpression === "") {
        return;
    }

    try {

        let expression = currentExpression;

        expression = expression.replace(
            /(\d+(\.\d+)?)%/g,
            "($1/100)"
        );

        expression = expression
            .replace(/×/g, "*")
            .replace(/÷/g, "/");

        if (!/^[0-9+\-*/().\s]+$/.test(expression)) {
            throw new Error();
        }

        let answer = Function(
            '"use strict"; return (' +
            expression +
            ')'
        )();

        if (!isFinite(answer)) {
            throw new Error();
        }

        answer = Number(
            parseFloat(answer.toFixed(10))
        );

        history.unshift({
            expression: currentExpression,
            result: answer
        });

        history = history.slice(0, 30);

        localStorage.setItem(
            "calculatorHistory",
            JSON.stringify(history)
        );

        expressionElement.innerText =
            currentExpression.replace(/\./g, ",");

        resultElement.innerText = answer;

        currentExpression = "";

    } catch {

        resultElement.innerText = "خطأ";
    }
}


function openHistory() {

    document
        .getElementById("historyPanel")
        .classList.add("open");

    showHistory();
}


function closeHistory() {

    document
        .getElementById("historyPanel")
        .classList.remove("open");
}


function showHistory() {

    const historyList =
        document.getElementById("historyList");

    historyList.innerHTML = "";

    if (history.length === 0) {

        historyList.innerHTML =
            '<div class="empty-history">لا توجد عمليات بعد</div>';

        return;
    }

    history.forEach(function(item) {

        const historyItem =
            document.createElement("div");

        historyItem.className =
            "history-item";

        historyItem.innerHTML = `
            <div class="history-expression">
                ${item.expression.replace(/\./g, ",")}
            </div>

            <div class="history-result">
                = ${item.result}
            </div>
        `;

        historyList.appendChild(historyItem);
    });
}


function clearHistory() {

    history = [];

    localStorage.removeItem("calculatorHistory");

    showHistory();
}


document.addEventListener("keydown", function(event) {

    const key = event.key;

    if (key >= "0" && key <= "9") {
        addValue(key);
    }

    else if (
        key === "+" ||
        key === "-" ||
        key === "*" ||
        key === "/" ||
        key === "%" ||
        key === "(" ||
        key === ")"
    ) {

        if (key === "*") {
            addValue("×");
        }

        else if (key === "/") {
            addValue("÷");
        }

        else {
            addValue(key);
        }
    }

    else if (key === "." || key === ",") {
        addValue(",");
    }

    else if (key === "Enter" || key === "=") {
        calculate();
    }

    else if (key === "Backspace") {
        backspace();
    }

    else if (key === "Escape") {
        clearAll();
    }

});

</script>

</body>
</html>
