     <!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leila Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dfffe8, #b8f5c8);
            padding: 20px;
        }

        .calculator {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #168a45;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            border: 2px solid #bde8ca;
            border-radius: 12px;
            font-size: 18px;
            outline: none;
        }

        input:focus {
            border-color: #24a85a;
        }

        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        button {
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            background: #24a85a;
            color: white;
        }

        button:active {
            transform: scale(0.97);
        }

        .clear {
            width: 100%;
            margin-top: 10px;
            background: #e74c3c;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 12px;
            background: #eefaf1;
            color: #168a45;
            font-size: 20px;
            font-weight: bold;
            min-height: 55px;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h1>🧮 Leila Calculator</h1>

        <input
            type="number"
            id="number1"
            placeholder="الرقم الأول"
        >

        <input
            type="number"
            id="number2"
            placeholder="الرقم الثاني"
        >

        <div class="buttons">
            <button onclick="calculate('+')">➕ جمع</button>
            <button onclick="calculate('-')">➖ طرح</button>
            <button onclick="calculate('*')">✖️ ضرب</button>
            <button onclick="calculate('/')">➗ قسمة</button>
        </div>

        <button class="clear" onclick="clearCalculator()">
            🗑️ مسح
        </button>

        <div id="result">
            النتيجة ستظهر هنا
        </div>

    </div>

    <script>
        function calculate(operation) {

            let number1 = document.getElementById("number1").value;
            let number2 = document.getElementById("number2").value;
            let result = document.getElementById("result");

            if (number1 === "" || number2 === "") {
                result.innerText = "⚠️ أدخلي الرقمين أولًا";
                return;
            }

            number1 = Number(number1);
            number2 = Number(number2);

            let answer;

            if (operation === "+") {
                answer = number1 + number2;
            }

            else if (operation === "-") {
                answer = number1 - number2;
            }

            else if (operation === "*") {
                answer = number1 * number2;
            }

            else if (operation === "/") {

                if (number2 === 0) {
                    result.innerText = "🚫 لا يمكن القسمة على صفر";
                    return;
                }

                answer = number1 / number2;
            }

            result.innerText = "النتيجة: " + answer;
        }


        function clearCalculator() {

            document.getElementById("number1").value = "";
            document.getElementById("number2").value = "";

            document.getElementById("result").innerText =
                "النتيجة ستظهر هنا";
        }
    </script>

</body>
</html>
