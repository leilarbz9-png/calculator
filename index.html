<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Leila Calculator</title>

<meta name="description"
content="آلة حاسبة بسيطة وسريعة مع سجل العمليات والوضع الليلي.">

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #ead8bb;

    font-family: Arial, sans-serif;

    transition: background 0.3s;
}

.calculator {

    width: 100%;
    max-width: 500px;

    min-height: 100vh;

    padding: 18px;

    background: #e5cba4;

    border: 3px solid #b89463;

    border-radius: 30px;

    transition: 0.3s;
}


/* الشريط العلوي */

.top {

    height: 50px;

    display: flex;

    justify-content: space-between;

    align-items: center;
}


.top-buttons {

    display: flex;

    gap: 8px;
}


.top-btn,
.history-btn {

    width: 45px;
    height: 45px;

    border: none;

    border-radius: 50%;

    background: #efd5aa;

    color: #4c2d18;

    font-size: 22px;

    cursor: pointer;

    transition:
    transform 0.15s ease,
    box-shadow 0.15s ease;
}


.top-btn:hover,
.history-btn:hover {

    transform: translateY(-2px);

}


.top-btn:active,
.history-btn:active {

    transform: scale(0.88);

}


/* زر النسخ */

.copy-btn {

    position: relative;
}


.copy-message {

    position: absolute;

    top: 52px;

    right: 50%;

    transform: translateX(50%);

    background: #754c2e;

    color: white;

    padding: 6px 10px;

    border-radius: 8px;

    font-size: 12px;

    white-space: nowrap;

    opacity: 0;

    pointer-events: none;

    transition: opacity 0.2s ease;
}


.copy-message.show {

    opacity: 1;

}


/* الشاشة */

.display {

    height: 150px;

    margin-bottom: 15px;

    padding: 20px;

    background: #f8ecd8;

    border: 2px solid #c39e6b;

    border-radius: 25px;

    display: flex;

    flex-direction: column;

    justify-content: flex-end;

    overflow: hidden;

    transition: 0.3s;
}


.expression {

    min-height: 30px;

    text-align: right;

    font-size: 22px;

    color: #80654b;

    word-break: break-all;

    overflow-wrap: anywhere;
}


.result {

    text-align: right;

    font-size: 42px;

    font-weight: bold;

    color: #4c2d18;

    word-break: break-all;

    overflow-x: auto;

    white-space: nowrap;

    scrollbar-width: none;
}


.result::-webkit-scrollbar {

    display: none;

}


/* الأزرار */

.buttons {

    display: grid;

    grid-template-columns:
    repeat(4, 1fr);

    gap: 12px;
}


.btn {

    min-height: 70px;

    border: none;

    border-radius: 22px;

    background: #efd5aa;

    color: #4c2d18;

    font-size: 26px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
    0 4px 0 #c39e6b;

    transition:
    transform 0.08s ease,
    box-shadow 0.08s ease,
    filter 0.15s ease;
}


.btn:hover {

    filter: brightness(1.05);

    transform: translateY(-1px);

}


.btn:active {

    transform:
    translateY(4px)
    scale(0.97);

    box-shadow: none;

}


.operator {

    background: #aa794d;

    color: white;
}


.clear {

    background: #c18b63;

    color: white;
}


.backspace {

    background: #9b7655;

    color: white;

    font-size: 29px;
}


.equal {

    background: #754c2e;

    color: white;

    grid-column: span 3;

    min-height: 75px;

    font-size: 30px;
}


.zero {

    grid-column: span 2;
}


/* السجل */

.history-panel {

    position: fixed;

    top: 0;

    right: -100%;

    width: min(400px, 90%);

    height: 100vh;

    background: #f8ecd8;

    z-index: 999;

    padding: 20px;

    box-shadow:
    -5px 0 20px rgba(0,0,0,0.2);

    transition: right 0.3s ease;

    overflow-y: auto;
}


.history-panel.open {

    right: 0;
}


.history-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    color: #4c2d18;
}


.close-history {

    width: 40px;
    height: 40px;

    border: none;

    border-radius: 50%;

    background: #aa794d;

    color: white;

    font-size: 25px;

    cursor: pointer;
}


.history-item {

    background: #efd5aa;

    border-radius: 15px;

    padding: 15px;

    margin: 10px 0;

    cursor: pointer;

    transition:
    transform 0.15s ease,
    filter 0.15s ease;
}


.history-item:hover {

    transform: translateX(-3px);

    filter: brightness(1.05);

}


.history-expression {

    color: #80654b;

    font-size: 18px;

    word-break: break-all;
}


.history-result {

    color: #4c2d18;

    font-size: 24px;

    font-weight: bold;

    margin-top: 5px;

    word-break: break-all;
}


.clear-history {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 15px;

    background: #754c2e;

    color: white;

    font-size: 18px;

    cursor: pointer;
}


/* الوضع الليلي */

body.dark {

    background: #171717;
}


body.dark .calculator {

    background: #292929;

    border-color: #444;
}


body.dark .display {

    background: #1f1f1f;

    border-color: #444;
}


body.dark .expression {

    color: #aaa;
}


body.dark .result {

    color: white;
}


body.dark .btn {

    background: #3b3b3b;

    color: white;

    box-shadow:
    0 4px 0 #222;
}


body.dark .operator {

    background: #8c623f;

    color: white;
}


body.dark .clear {

    background: #9b6847;
}


body.dark .backspace {

    background: #70543e;
}


body.dark .equal {

    background: #68442b;
}


body.dark .top-btn,
body.dark .history-btn {

    background: #3b3b3b;

    color: white;
}


body.dark .history-panel {

    background: #202020;
}


body.dark .history-header {

    color: white;
}


body.dark .history-item {

    background: #333;
}


body.dark .history-expression {

    color: #aaa;
}


body.dark .history-result {

    color: white;
}


/* الهاتف */

@media (max-width: 500px) {

    body {

        align-items: stretch;

    }


    .calculator {

        min-height: 100vh;

        width: 100%;

        max-width: none;

        border-radius: 0;

        border-left: none;

        border-right: none;

        padding: 12px;

    }


    .display {

        height: 155px;

        padding: 18px;

        margin-bottom: 14px;

    }


    .expression {

        font-size: 19px;

    }


    .result {

        font-size: 36px;

    }


    .buttons {

        gap: 9px;

    }


    .btn {

        min-height: 65px;

        border-radius: 19px;

        font-size: 24px;

    }


    .backspace {

        font-size: 27px;

    }


    .equal {

        min-height: 70px;

    }

}


@media (max-width: 360px) {

    .calculator {

        padding: 9px;

    }


    .buttons {

        gap: 7px;

    }


    .btn {

        min-height: 58px;

        border-radius: 16px;

        font-size: 21px;

    }


    .backspace {

        font-size: 24px;

    }


    .display {

        height: 140px;

        padding: 14px;

    }


    .result {

        font-size: 31px;

    }

}

</style>

</head>


<body>

</div>



<div
class="history-panel"
id="historyPanel">


    <div class="history-header">


        <h2>
        سجل العمليات
        </h2>


        <button
        class="close-history"
        id="closeHistory"
        type="button">

        ×

        </button>

    <div id="historyList"></div>


    <button
    class="clear-history"
    id="clearHistory"
    type="button">

    مسح السجل

<script>

let currentExpression = "";

let history = [];


/* تحميل السجل */

try {

    history =
    JSON.parse(
        localStorage.getItem(
            "calculatorHistory"
        )
    ) || [];

}

catch {

    history = [];

}


const expression =
document.getElementById(
    "expression"
);


const result =
document.getElementById(
    "result"
);


const copyButton =
document.getElementById(
    "copyButton"
);


const copyMessage =
document.getElementById(
    "copyMessage"
);


/* معرفة نوع آخر عنصر */

function getLastChar() {

    return currentExpression
        .slice(-1);

}


/* هل آخر عنصر عملية؟ */

function isOperator(char) {

    return (
        char === "+" ||
        char === "-" ||
        char === "×" ||
        char === "÷"
    );

}


/* إضافة قيمة */

function addValue(value) {


    /* إذا كانت هناك نتيجة سابقة */

    if (

        result.innerText !== "0" &&

        result.innerText !== "" &&

        currentExpression === ""

    ) {


        if (
            isOperator(value)
        ) {

            currentExpression =
            result.innerText;

        }

        else {

            currentExpression = "";

        }

    }


    /* الأرقام */

    if (
        value >= "0" &&
        value <= "9"
    ) {

        currentExpression += value;

    }


    /* الفاصلة */

    else if (
        value === ","
    ) {

        let parts =
        currentExpression.split(
            /[+\-×÷()]/ 
        );

        let lastNumber =
        parts[parts.length - 1];


        if (
            lastNumber.includes(".")
        ) {

            return;

        }


        if (
            lastNumber === ""
        ) {

            currentExpression += "0.";

        }

        else {

            currentExpression += ".";

        }

    }


    /* العمليات */

    else if (
        isOperator(value)
    ) {


        if (
            currentExpression === ""
        ) {

            if (value === "-") {

                currentExpression = "-";

            }

            else {

                return;

            }

        }

        else {

            let last =
            getLastChar();


            if (
                isOperator(last)
            ) {

                currentExpression =
                currentExpression.slice(
                    0,
                    -1
                ) + value;

            }

            else {

                currentExpression += value;

            }

        }

    }


    /* النسبة */

    else if (
        value === "%"
    ) {


        let last =
        getLastChar();


        if (
            last >= "0" &&
            last <= "9"
        ) {

            currentExpression += "%";

        }

        else {

            return;

        }

    }


    /* الأقواس */

    else if (
        value === "("
    ) {


        if (
            currentExpression === "" ||
            isOperator(getLastChar()) ||
            getLastChar() === "("
        ) {

            currentExpression += "(";

        }

        else {

            return;

        }

    }


    else if (
        value === ")"
    ) {


        if (
            currentExpression === ""
        ) {

            return;

        }


        let opens =
        (currentExpression.match(
            /\(/g
        ) || []).length;


        let closes =
        (currentExpression.match(
            /\)/g
        ) || []).length;


        if (
            opens <= closes
        ) {

            return;

        }


        let last =
        getLastChar();


        if (
            isOperator(last) ||
            last === "("
        ) {

            return;

        }


        currentExpression += ")";

    }


    updateDisplay();

}



/* تحديث الشاشة */

function updateDisplay() {

    expression.innerText =
    currentExpression.replace(
        /\./g,
        ","
    );


    result.innerText = "";

}



/* الحذف */

function backspace() {


    currentExpression =
    currentExpression.slice(
        0,
        -1
    );


    expression.innerText =
    currentExpression.replace(
        /\./g,
        ","
    );


    if (
        currentExpression === ""
    ) {

        result.innerText = "0";

    }

}



/* مسح */

function clearAll() {

    currentExpression = "";

    expression.innerText = "";

    result.innerText = "0";

}



/* الحساب */

function calculate() {


    if (
        currentExpression === ""
    ) {

        return;

    }


    try {


        let exp =
        currentExpression;


        /* تحويل النسب */

        exp =
        exp.replace(
            /(\d+(?:\.\d+)?)%/g,
            "($1/100)"
        );


        /* العمليات */

        exp =
        exp.replace(
            /×/g,
            "*"
        );


        exp =
        exp.replace(
            /÷/g,
            "/"
        );


        /* التحقق */

        if (
            !/^[0-9+\-*/().\s]+$/.test(exp)
        ) {

            throw new Error();

        }


        /* منع نهاية غير صحيحة */

        if (
            /[+\-*/.]$/.test(exp)
        ) {

            throw new Error();

        }


        let answer =
        Function(
            '"use strict"; return (' +
            exp +
            ')'
        )();


        if (
            typeof answer !== "number" ||
            !isFinite(answer)
        ) {

            throw new Error();

        }


        answer =
        Number(
            parseFloat(
                answer.toFixed(10)
            )
        );


        /* حفظ السجل */

        history.unshift({

            expression:
            currentExpression,

            result:
            answer

        });


        history =
        history.slice(0, 30);


        localStorage.setItem(
            "calculatorHistory",
            JSON.stringify(history)
        );


        expression.innerText =
        currentExpression.replace(
            /\./g,
            ","
        );


        result.innerText =
        answer;


        currentExpression = "";


    }

    catch {

        result.innerText =
        "خطأ";

    }

}



/* فتح السجل */

function openHistory() {

    document
    .getElementById(
        "historyPanel"
    )
    .classList.add(
        "open"
    );


    showHistory();

}



/* إغلاق السجل */

function closeHistory() {

    document
    .getElementById(
        "historyPanel"
    )
    .classList.remove(
        "open"
    );

}



/* عرض السجل */

function showHistory() {


    const list =
    document.getElementById(
        "historyList"
    );


    list.innerHTML = "";


    if (
        history.length === 0
    ) {

        list.innerHTML =
        "<div>لا توجد عمليات بعد</div>";

        return;

    }


    history.forEach(
        function(item, index) {


            const div =
            document.createElement(
                "div"
            );


            div.className =
            "history-item";


            div.innerHTML =

            '<div class="history-expression">' +

            item.expression.replace(
                /\./g,
                ","
            ) +

            "</div>" +

            '<div class="history-result">' +

            "= " +

            item.result +

            "</div>";


            /* الضغط على عملية قديمة */

            div.addEventListener(
                "click",
                function() {


                    currentExpression =
                    item.expression;


                    expression.innerText =
                    currentExpression.replace(
                        /\./g,
                        ","
                    );


                    result.innerText = "";


                    closeHistory();

                }
            );


            list.appendChild(div);

        }
    );

}



/* مسح السجل */

function clearHistory() {


    history = [];


    localStorage.removeItem(
        "calculatorHistory"
    );


    showHistory();

}



/* نسخ النتيجة */

async function copyResult() {


    const text =
    result.innerText;


    if (
        !text ||
        text === "0" ||
        text === "خطأ"
    ) {

        return;

    }


    try {


        await navigator.clipboard.writeText(
            text
        );


    }

    catch {


        const textarea =
        document.createElement(
            "textarea"
        );


        textarea.value = text;


        document.body.appendChild(
            textarea
        );


        textarea.select();


        document.execCommand(
            "copy"
        );


        textarea.remove();

    }


    copyMessage.classList.add(
        "show"
    );


    setTimeout(
        function() {

            copyMessage.classList.remove(
                "show"
            );

        },
        1200
    );

}



/* أزرار الآلة */

document
.querySelectorAll(
    ".btn"
)
.forEach(
    function(button) {


        button.addEventListener(
            "click",
            function() {


                const value =
