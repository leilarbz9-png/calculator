<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Calculator</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: #ead8bb;

    font-family: Arial, sans-serif;
}

.calculator {

    width: 100%;
    max-width: 500px;

    min-height: 100vh;

    padding: 18px;

    background: #e5cba4;

    border: 3px solid #b89463;

    border-radius: 30px;
}


.top {

    height: 50px;

    display: flex;
    justify-content: flex-start;
    align-items: center;
}


.history-btn {

    width: 45px;
    height: 45px;

    border: none;

    border-radius: 50%;

    background: #efd5aa;

    color: #4c2d18;

    font-size: 25px;

    cursor: pointer;
}


.display {

    height: 150px;

    margin-bottom: 15px;

    padding: 20px;

    background: #f8ecd8;

    border: 2px solid #c39e6b;

    border-radius: 25px;

    display: flex;

    flex-direction: column;

    justify-content: flex-end;

    overflow: hidden;
}


.expression {

    min-height: 30px;

    text-align: right;

    font-size: 22px;

    color: #80654b;

    word-break: break-all;
}


.result {

    text-align: right;

    font-size: 42px;

    font-weight: bold;

    color: #4c2d18;

    word-break: break-all;
}


.buttons {

    display: grid;

    grid-template-columns:
    repeat(4, 1fr);

    gap: 12px;
}


.btn {

    min-height: 70px;

    border: none;

    border-radius: 22px;

    background: #efd5aa;

    color: #4c2d18;

    font-size: 26px;

    font-weight: bold;

    cursor: pointer;
}


.btn:active {

    transform: scale(0.95);
}


.operator {

    background: #aa794d;

    color: white;
}


.clear {

    background: #c18b63;

    color: white;
}


.backspace {

    background: #9b7655;

    color: white;
}


.equal {

    background: #754c2e;

    color: white;

    grid-column: span 3;

    min-height: 75px;
}


.zero {

    grid-column: span 2;
}


.history-panel {

    position: fixed;

    top: 0;

    right: -100%;

    width: min(400px, 90%);

    height: 100vh;

    background: #f8ecd8;

    z-index: 999;

    padding: 20px;

    box-shadow:
    -5px 0 20px rgba(0,0,0,0.2);

    transition: right 0.3s ease;

    overflow-y: auto;
}


.history-panel.open {

    right: 0;
}


.history-header {

    display: flex;

    justify-content: space-between;

    align-items: center;

    color: #4c2d18;
}


.close-history {

    width: 40px;
    height: 40px;

    border: none;

    border-radius: 50%;

    background: #aa794d;

    color: white;

    font-size: 25px;

    cursor: pointer;
}


.history-item {

    background: #efd5aa;

    border-radius: 15px;

    padding: 15px;

    margin: 10px 0;
}


.history-expression {

    color: #80654b;

    font-size: 18px;
}


.history-result {

    color: #4c2d18;

    font-size: 24px;

    font-weight: bold;

    margin-top: 5px;
}


.clear-history {

    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 15px;

    background: #754c2e;

    color: white;

    font-size: 18px;

    cursor: pointer;
}


@media (max-width: 500px) {

    .calculator {

        border-radius: 0;

        border-left: none;

        border-right: none;

        padding: 12px;
    }

    .btn {

        min-height: 65px;

        font-size: 24px;

    }

    .result {

        font-size: 36px;
    }

}

</style>

</head>


<body>


<div class="calculator">


    <div class="top">

        <button
        class="history-btn"
        id="historyButton"
        type="button">

        ↶

        </button>

    </div>


    <div class="display">

        <div
        class="expression"
        id="expression">
        </div>

        <div
        class="result"
        id="result">

        0

        </div>

    </div>


    <div class="buttons">


        <button
        class="btn clear"
        type="button"
        data-value="C">

        C

        </button>


        <button
        class="btn"
        type="button"
        data-value="(">

        (

        </button>


        <button
        class="btn"
        type="button"
        data-value=")">

        )

        </button>


        <button
        class="btn operator"
        type="button"
        data-value="%">

        %

        </button>


        <button
        class="btn"
        type="button"
        data-value="7">

        7

        </button>


        <button
        class="btn"
        type="button"
        data-value="8">

        8

        </button>


        <button
        class="btn"
        type="button"
        data-value="9">

        9

        </button>


        <button
        class="btn operator"
        type="button"
        data-value="÷">

        ÷

        </button>


        <button
        class="btn"
        type="button"
        data-value="4">

        4

        </button>


        <button
        class="btn"
        type="button"
        data-value="5">

        5

        </button>


        <button
        class="btn"
        type="button"
        data-value="6">

        6

        </button>


        <button
        class="btn operator"
        type="button"
        data-value="×">

        ×

        </button>


        <button
        class="btn"
        type="button"
        data-value="1">

        1

        </button>


        <button
        class="btn"
        type="button"
        data-value="2">

        2

        </button>


        <button
        class="btn"
        type="button"
        data-value="3">

        3

        </button>


        <button
        class="btn operator"
        type="button"
        data-value="-">

        −

        </button>


        <button
        class="btn zero"
        type="button"
        data-value="0">

        0

        </button>


        <button
        class="btn"
        type="button"
        data-value=",">

        ,

        </button>


        <button
        class="btn operator"
        type="button"
        data-value="+">

        +

        </button>


        <button
        class="btn backspace"
        id="backspaceButton"
        type="button">

        ⌫

        </button>


        <button
        class="btn equal"
        id="equalButton"
        type="button">

        =

        </button>


    </div>

</div>



<div
class="history-panel"
id="historyPanel">


    <div class="history-header">

        <h2>
        سجل العمليات
        </h2>

        <button
        class="close-history"
        id="closeHistory"
        type="button">

        ×

        </button>

    </div>


    <div id="historyList"></div>


    <button
    class="clear-history"
    id="clearHistory"
    type="button">

    مسح السجل

    </button>


</div>



<script>


let currentExpression = "";


let history = [];


try {

    history =
    JSON.parse(
    localStorage.getItem(
    "calculatorHistory"
    )
    ) || [];

}
catch {

    history = [];

}



const expression =
document.getElementById(
"expression"
);


const result =
document.getElementById(
"result"
);



function addValue(value) {


    if (
    result.innerText !== "0" &&
    result.innerText !== "" &&
    currentExpression === ""
    ) {

        currentExpression =
        result.innerText;

    }


    if (value === ",") {

        value = ".";

    }


    currentExpression += value;


    expression.innerText =
    currentExpression.replace(
    /\./g,
    ","
    );


    result.innerText = "";

}



function backspace() {


    currentExpression =
    currentExpression.slice(
    0,
    -1
    );


    expression.innerText =
    currentExpression.replace(
    /\./g,
    ","
    );


    if (
    currentExpression === ""
    ) {

        result.innerText = "0";

    }

}



function clearAll() {


    currentExpression = "";


    expression.innerText = "";


    result.innerText = "0";

}



function calculate() {


    if (
    currentExpression === ""
    ) {

        return;

    }


    try {


        let exp =
        currentExpression;


        exp =
        exp.replace(
        /(\d+(\.\d+)?)%/g,
        "($1/100)"
        );


        exp =
        exp.replace(
        /×/g,
        "*"
        );


        exp =
        exp.replace(
        /÷/g,
        "/"
        );


        if (
        !/^[0-9+\-*/().\s]+$/.test(exp)
        ) {

            throw new Error();

        }


        let answer =
        Function(
        '"use strict"; return (' +
        exp +
        ')'
        )();


        if (
        typeof answer !== "number" ||
        !isFinite(answer)
        ) {

            throw new Error();

        }


        answer =
        Number(
        parseFloat(
        answer.toFixed(10)
        )
        );


        history.unshift({

            expression:
            currentExpression,

            result:
            answer

        });


        history =
        history.slice(0, 30);


        localStorage.setItem(
        "calculatorHistory",
        JSON.stringify(history)
        );


        expression.innerText =
        currentExpression.replace(
        /\./g,
        ","
        );


        result.innerText =
        answer;


        currentExpression = "";


    }

    catch {

        result.innerText =
        "خطأ";

    }

}



function openHistory() {


    document
    .getElementById(
    "historyPanel"
    )
    .classList.add(
    "open"
    );


    showHistory();

}



function closeHistory() {


    document
    .getElementById(
    "historyPanel"
    )
    .classList.remove(
    "open"
    );

}



function showHistory() {


    const list =
    document.getElementById(
    "historyList"
    );


    list.innerHTML = "";


    if (
    history.length === 0
    ) {

        list.innerHTML =
        '<div>لا توجد عمليات بعد</div>';

        return;

    }


    history.forEach(
    function(item) {


        const div =
        document.createElement(
        "div"
        );


        div.className =
        "history-item";


        div.innerHTML =

        '<div class="history-expression">' +

        item.expression.replace(
        /\./g,
        ","
        ) +

        '</div>' +

        '<div class="history-result">' +

        '= ' +
        item.result +

        '</div>';


        list.appendChild(div);

    });

}



function clearHistory() {


    history = [];


    localStorage.removeItem(
    "calculatorHistory"
    );


    showHistory();

}



document
.querySelectorAll(
".btn"
)
.forEach(
function(button) {


    button.addEventListener(
    "click",
    function() {


        const value =
        button.dataset.value;


        if (value === "C") {

            clearAll();

            return;

        }


        if (button.id === "backspaceButton") {

            backspace();

            return;

        }


        if (button.id === "equalButton") {

            calculate();

            return;

        }


        addValue(value);

    });

});



document
.getElementById(
"historyButton"
)
.addEventListener(
"click",
openHistory
);



document
.getElementById(
"closeHistory"
)
.addEventListener(
"click",
closeHistory
);



document
.getElementById(
"clearHistory"
)
.addEventListener(
"click",
clearHistory
);



document.addEventListener(
"keydown",
function(event) {


    const key =
    event.key;


    if (
    key >= "0" &&
    key <= "9"
    ) {

        addValue(key);

    }


    else if (
    key === "+" ||
    key === "-" ||
    key === "%" ||
    key === "(" ||
    key === ")"
    ) {

        addValue(key);

    }


    else if (key === "*") {

        addValue("×");

    }


    else if (key === "/") {

        addValue("÷");

    }


    else if (
    key === "." ||
    key === ","
    ) {

        addValue(",");

    }


    else if (
    key === "Enter" ||
    key === "="
    ) {

        calculate();

    }


    else if (
    key === "Backspace"
    ) {

        backspace();

    }


    else if (
    key === "Escape"
    ) {

        clearAll();

    }

});


</script>


</body>

    </html>
